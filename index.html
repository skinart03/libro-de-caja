<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E3B32">
<title>Libro de Caja S KIN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Libro de Caja">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#0B1512;--card:#0E3B32;--ink:#F2FBF7;--muted:#A9C7BD;--accent:#4FC3A1;--btn-ink:#06231D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:32px 24px;display:grid;gap:18px}
.mark{width:56px;height:56px;border-radius:14px;display:block}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);line-height:1.5}
a.btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--btn-ink);font-weight:600;font-size:18px;padding:16px;border-radius:14px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){a.btn{transition:transform .15s}a.btn:active{transform:scale(.98)}}
small{color:var(--muted);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main>
  <img class="mark" src="icon-192.png" alt="">
  <p class="eyebrow">S KIN LABS · Finanzas</p>
  <h1>Libro de Caja</h1>
  <p>Ingresos, gastos, ahorro por objetivo, topes, vencimientos y monotributo.</p>
  <a class="btn" href="https://claude.ai/artifact/9kB7h82dnm42Bfy57svXgL">Abrir Libro de Caja</a>
  <small>Se abre en Claude con tu sesión iniciada. Es privado: solo vos podés ver tus datos.</small>
</main>
</body>
</html>
